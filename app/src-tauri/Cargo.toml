[package]
name = "nexus"
version = "1.0.0"
edition = "2021"
rust-version = "1.78"
description = "NEXUS — local-first AI workbench"
authors = ["NEXUS"]
license = "MIT"
default-run = "nexus"

[lib]
name = "nexus_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "nexus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-single-instance = "2.0.0"

# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "fs", "process", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# HTTP / streaming
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
bytes = "1.7"

# Database
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite", "blob"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
refinery = { version = "0.8", features = ["rusqlite"] }
sqlite-vec = "0.1"

# Serde / utils
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
thiserror = "1.0"
anyhow = "1.0"
base64 = "0.22"
ulid = { version = "1.1", features = ["serde"] }
uuid = { version = "1.10", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1.20"
log = "0.4"
env_logger = "0.11"
fern = "0.6"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
dirs = "5.0"
path-clean = "1.0"
which = "6.0"
sysinfo = "0.32"
regex = "1.10"
toml = "0.8"
csv = "1.3"
# NOTE: zip's default feature set includes `xz`, which pulls in `xz2`
# and `liblzma-sys` and ultimately requires `liblzma-5.dll` on Windows
# at runtime. That DLL is not on most Windows installs, so we pin to a
# minimal feature set here: only the deflate codec is needed for DOCX
# and XLSX extraction.
#
# We do NOT add an explicit `xz2` dep with the `static` feature: that
# forces lzma-sys to compile the C library from source via `cc`, which
# on the Windows GNU toolchain needs `dlltool.exe` and a working mingw
# toolchain in the build environment. The minimal-feature approach
# (drop `xz2` entirely from the dep tree) is cleaner and equally
# effective at the Windows-runtime level.
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Text processing
unicode-segmentation = "1.12"
aho-corasick = "1.1"

# PDF / DOCX / IPYNB
pdf-extract = "0.7"
docx-rs = "0.4"
scraper = "0.20"
calamine = "0.26"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1
incremental = true
